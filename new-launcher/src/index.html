<!DOCTYPE html>

<link href="output.css" rel="stylesheet" />

<script>
  const { invoke } = window.__TAURI__.core

  invoke("show_window")
</script>

<html data-tauri-drag-region>
  <body data-tauri-drag-region class="select-none">
    <div data-tauri-drag-region class="flex justify-center">
      <span
        data-tauri-drag-region
        class="mt-4 text-xl bg-black rounded-full px-4 py-1"
        >Some Game Name</span
      >
    </div>
    <button
      onclick="invoke('hide_window')"
      class="absolute right-18 top-4 bg-green-500 text-black rounded-full pt-1 pb-2 px-4 text-xl hover:scale-110 active:scale-95 transition-all cursor-pointer hover:bg-green-600 active:bg-green-800 duration-150"
    >
      _
    </button>
    <button
      onclick="invoke('close_window')"
      class="absolute right-4 top-4 bg-red-500 text-black rounded-full pt-1 pb-2 px-4 text-xl hover:scale-110 active:scale-95 transition-all cursor-pointer hover:bg-red-600 active:bg-red-800 duration-150"
    >
      x
    </button>
    <button
      onclick="invoke('run_game')"
      class="absolute bottom-8 right-8 bg-yellow-500 text-black rounded-full py-4 px-16 text-xl font-bold hover:scale-105 active:scale-95 transition-all cursor-pointer hover:bg-yellow-600 active:bg-yellow-800 duration-150"
    >
      Start Game
    </button>
  </body>
</html>
